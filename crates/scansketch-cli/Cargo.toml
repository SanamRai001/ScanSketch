[package]
name = "scansketch-cli"
version = "0.1.0"
default-run = "scansketch"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native ScanSketch image-to-strokes research CLI"

[dependencies]
scansketch-core = { path = "../scansketch-core" }
image.workspace = true
serde.workspace = true
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "scansketch"
path = "src/main.rs"

[[bin]]
name = "scansketch-measure"
path = "src/bin/measure.rs"

[[bin]]
name = "scansketch-fixtures"
path = "src/bin/fixtures.rs"

[[bin]]
name = "scansketch-white-audit"
path = "src/bin/white_audit.rs"

[[bin]]
name = "scansketch-path-fixture"
path = "src/bin/path_fixture.rs"
