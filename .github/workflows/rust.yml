name: Rust workspace checks

on:
  pull_request:
  push:
    branches:
      - feat/p2-sketch-stroke-language
      - feat/p2b1-contour-coherence
      - feat/p2c-measurement-utility
      - feat/p3a1-placement-aware-proposals
      - feat/p3a21-selective-hybrid-replacement
      - feat/p3a22-missing-structure-residual
      - feat/p3a23-deficit-driven-proposals
      - test/p3g1-nonportrait-generalization
      - feat/p4a0-path-primitive
      - feat/p4a1-long-structural-paths
      - feat/p4a2-medium-form-paths

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Check workspace
        run: cargo check --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Smoke-test synthetic white fixture and measurement CLI
        shell: bash
        run: |
          cargo run -p scansketch-cli --bin scansketch-fixtures -- --output-dir experiments/local/ci
          cargo run -p scansketch-cli --bin scansketch -- --input experiments/local/ci/white.png --output experiments/local/ci/white-output.png --strokes experiments/local/ci/white-strokes.json --max-size 64
          cargo run -p scansketch-cli --bin scansketch-measure -- --source experiments/local/ci/white.png --preview experiments/local/ci/white-output.png --strokes experiments/local/ci/white-strokes.json --max-size 64 --report experiments/local/ci/white-report.json
          python3 -c "import json; r=json.load(open('experiments/local/ci/white-report.json')); assert r['tone_rmse']==0 and r['unwanted_highlight_ink_fraction']==0 and r['strokes']['count']==0, r"
      - name: Smoke-test P4-A.0 first-class logical path primitive
        shell: bash
        run: |
          cargo run -p scansketch-cli --bin scansketch-path-fixture -- --output experiments/local/ci/p4a0-path.png --strokes experiments/local/ci/p4a0-path.json
          cargo run -p scansketch-cli --bin scansketch-measure -- --source experiments/local/ci/white.png --preview experiments/local/ci/p4a0-path.png --strokes experiments/local/ci/p4a0-path.json --max-size 64 --report experiments/local/ci/p4a0-path-report.json
          python3 - <<'PY'
          import json
          sketch=json.load(open('experiments/local/ci/p4a0-path.json'))
          report=json.load(open('experiments/local/ci/p4a0-path-report.json'))
          assert sketch['strokes'] == [], sketch
          assert len(sketch['paths']) == 1, sketch
          assert len(sketch['paths'][0]['points']) == 7, sketch
          assert sketch['paths'][0]['role'] == 'gesture', sketch
          assert report['strokes']['count'] == 0, report['strokes']
          assert report['paths']['count'] == 1, report['paths']
          assert report['paths']['gesture_count'] == 1, report['paths']
          assert report['paths']['total_path_length_px'] > 55, report['paths']
          assert report['marks']['logical_count'] == 1, report['marks']
          assert report['marks']['segment_count'] == 0, report['marks']
          assert report['marks']['path_count'] == 1, report['marks']
          print('P4-A.0 path primitive smoke passed:', report['paths'])
          PY
      - name: Smoke-test P4-A.1 long structural path tracing
        shell: pwsh
        run: |
          ./scripts/run-p4a1-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/p4a1-step -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P4-A.1 paired smoke failed" }
          $s = Get-Content experiments/local/ci/p4a1-step/summary.json -Raw | ConvertFrom-Json
          if (-not $s.baseline_segments_exactly_preserved) { throw "P4-A.1 changed baseline segments" }
          if (-not $s.overlay_paths_equal_paths_only) { throw "P4-A.1 overlay/path-only mismatch" }
          if ($s.long_path_stats.accepted -le 0) { throw "P4-A.1 accepted no long paths" }
          if ($s.long_path_stats.mean_path -lt 24) { throw "P4-A.1 mean path is not human-scale yet" }
          if ($s.long_path_stats.max_path -lt 40) { throw "P4-A.1 step did not produce a clearly long path" }
          $base = $s.fixtures | Where-Object { $_.mode -eq 'p2b1' }
          $overlay = $s.fixtures | Where-Object { $_.mode -eq 'p4a1-overlay' }
          $paths = $s.fixtures | Where-Object { $_.mode -eq 'p4a1-paths' }
          if ($base.path_count -ne 0) { throw "Frozen P2-B.1 unexpectedly contains P4 paths" }
          if ($overlay.segment_count -ne $base.segment_count) { throw "Overlay segment count changed" }
          if ($paths.segment_count -ne 0) { throw "Paths-only output contains old scan fragments" }
          if ($overlay.path_count -ne $paths.path_count) { throw "Gesture path counts differ" }
          Write-Host ("P4-A.1 step: {0} long paths; mean={1}px; max={2}px; baseline segments={3}" -f $s.long_path_stats.accepted,$s.long_path_stats.mean_path,$s.long_path_stats.max_path,$base.segment_count)
      - name: Smoke-test P4-A.2 medium Form hierarchy
        shell: pwsh
        run: |
          ./scripts/run-p4a2-ab.ps1 -InputImage experiments/local/ci/form-detail.png -OutputDir experiments/local/ci/p4a2-form-detail -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P4-A.2 paired smoke failed" }
          $s = Get-Content experiments/local/ci/p4a2-form-detail/summary.json -Raw | ConvertFrom-Json
          if (-not $s.baseline_segments_exactly_preserved) { throw "P4-A.2 changed frozen baseline segments" }
          if (-not $s.p4a1_gestures_exactly_preserved) { throw "P4-A.2 changed P4-A.1 Gestures" }
          if (-not $s.overlay_paths_equal_paths_only) { throw "P4-A.2 overlay/path-only mismatch" }
          if ($s.hierarchy_stats.forms -le 0) { throw "P4-A.2 generated no Form paths" }
          if ($s.hierarchy_stats.form_mean -lt 8 -or $s.hierarchy_stats.form_mean -gt 32) { throw "P4-A.2 Form mean outside 8-32px band" }
          if ($s.hierarchy_stats.form_max -lt 8 -or $s.hierarchy_stats.form_max -gt 32.01) { throw "P4-A.2 Form max outside band" }
          $p4a1 = $s.fixtures | Where-Object { $_.mode -eq 'p4a1-paths' }
          $p4a2 = $s.fixtures | Where-Object { $_.mode -eq 'p4a2-paths' }
          if ($p4a1.segment_count -ne 0 -or $p4a2.segment_count -ne 0) { throw "P4 paths-only mode contains legacy segments" }
          if ($p4a2.gesture_count -ne $s.hierarchy_stats.gestures) { throw "Gesture accounting mismatch" }
          if ($p4a2.form_count -ne $s.hierarchy_stats.forms) { throw "Form accounting mismatch" }
          Write-Host ("P4-A.2 form detail: gestures={0}; forms={1}; gesture mean={2}px; form mean={3}px; form max={4}px" -f $s.hierarchy_stats.gestures,$s.hierarchy_stats.forms,$s.hierarchy_stats.gesture_mean,$s.hierarchy_stats.form_mean,$s.hierarchy_stats.form_max)
      - name: Validate paired synthetic P2-C experiment script
        shell: pwsh
        run: |
          ./scripts/run-p2c-synthetic.ps1 -FixtureDir experiments/local/ci -OutputDir experiments/local/ci/paired
          $summary = Get-Content experiments/local/ci/paired/summary.json -Raw | ConvertFrom-Json
          if ($summary.fixtures.Count -ne 6) { throw "Expected six paired experiment reports" }
          if (@($summary.fixtures | Where-Object { $_.mode -eq "p2a" }).Count -ne 3) { throw "Expected three P2-A controls" }
          if (@($summary.fixtures | Where-Object { $_.mode -eq "p2b1" }).Count -ne 3) { throw "Expected three P2-B.1 variants" }
      - name: Audit exact white-channel pixel locations
        shell: pwsh
        run: |
          cargo run -p scansketch-cli --bin scansketch-white-audit -- --source experiments/local/ci/square-white-channel.png --preview experiments/local/ci/paired/square-white-channel-p2a.png --max-size 64 --roi '29,8,6,48' --report experiments/local/ci/paired/channel-p2a-white-audit.json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "P2-A white audit failed" }
          cargo run -p scansketch-cli --bin scansketch-white-audit -- --source experiments/local/ci/square-white-channel.png --preview experiments/local/ci/paired/square-white-channel-p2b1.png --max-size 64 --roi '29,8,6,48' --report experiments/local/ci/paired/channel-p2b1-white-audit.json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "P2-B.1 white audit failed" }
          foreach ($mode in @('p2a','p2b1')) {
            $audit = Get-Content "experiments/local/ci/paired/channel-$mode-white-audit.json" -Raw | ConvertFrom-Json
            $m = Get-Content "experiments/local/ci/paired/square-white-channel-$mode-report.json" -Raw | ConvertFrom-Json
            if ($audit.source_white_pixels -ne $m.white_region.pixels) { throw "Mode $mode - source-white mask mismatch" }
            $expected = [math]::Round($m.unwanted_highlight_ink_fraction * $m.white_region.pixels)
            if ($audit.affected_white_pixels -ne $expected) { throw "Mode $mode - different white-ink count than p2c-v1 metrics" }
            if ($audit.roi_source_white_pixels -ne 288) { throw "Mode $mode - expected exactly 288 protected channel pixels" }
            if ($audit.roi_affected_white_pixels + $audit.outside_roi_affected_white_pixels -ne $audit.affected_white_pixels) { throw "Mode $mode - ROI accounting mismatch" }
            Write-Host ("WHITE AUDIT {0}: source-white={1}; affected={2}; inside channel={3}; exterior={4}; near source black <=1px={5}; near <=2px={6}; farther than 2px={7}" -f $mode, $audit.source_white_pixels, $audit.affected_white_pixels, $audit.roi_affected_white_pixels, $audit.outside_roi_affected_white_pixels, $audit.near_source_nonwhite_1px, $audit.near_source_nonwhite_2px, $audit.farther_than_2px)
          }
      - name: Smoke-test paired photo experiment script on permitted synthetic source
        shell: pwsh
        run: |
          ./scripts/run-p2c-photo-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/photo-paired-smoke -MaxSize 64 -Seed 42 -RightsConfirmed
          $s = Get-Content experiments/local/ci/photo-paired-smoke/summary.json -Raw | ConvertFrom-Json
          if ($s.fixtures.Count -ne 2) { throw "Expected exactly two paired reports" }
          if ($s.fixtures[0].mode -ne 'p2a' -or $s.fixtures[1].mode -ne 'p2b1') { throw "Wrong comparison modes" }
          if ($s.fixtures[0].source_sha256 -ne $s.fixtures[1].source_sha256) { throw "Not the same source" }
          if ($s.fixtures[0].seed -ne $s.fixtures[1].seed -or $s.fixtures[0].git_sha -ne $s.fixtures[1].git_sha) { throw "Not the same rendering context" }
          if ($s.fixtures[0].stroke_count -le 0) { throw "Expected nonempty synthetic stroke record" }
          Write-Host "Paired nonportrait script smoke passed on synthetic fixture; real photograph still pending"
      - name: Smoke-test opt-in directional mode against exact P2-B.1 control
        shell: pwsh
        run: |
          ./scripts/run-p3a-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/p3a-step -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P3-A paired run failed" }
          $s = Get-Content experiments/local/ci/p3a-step/summary.json -Raw | ConvertFrom-Json
          if ($s.fixtures.Count -ne 2) { throw "Expected two paired reports" }
          if ($s.fixtures[0].mode -ne 'p2b1' -or $s.fixtures[1].mode -ne 'p3a') { throw "Wrong comparison modes" }
          if ($s.fixtures[0].strokes -ne $s.fixtures[1].strokes) { throw "P3-A should not increase stroke budget" }
          if ($s.ink_metadata_changed_strokes -ne 0) { throw "Ink widths or opacity unexpectedly changed" }
          if ($s.geometrically_changed_strokes -le 0) { throw "Synthetic step did not exercise directional geometry" }
          Write-Host ("P3-A smoke: changed {0} directional segment geometries with matching total {1} strokes" -f $s.geometrically_changed_strokes, $s.fixtures[0].strokes)

      - name: Smoke-test P3-A.1 placement-aware proposals against frozen P2-B.1
        shell: pwsh
        run: |
          ./scripts/run-p3a1-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/p3a1-step -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P3-A.1 paired smoke failed" }
          $s = Get-Content experiments/local/ci/p3a1-step/summary.json -Raw | ConvertFrom-Json
          if ($s.fixtures.Count -ne 2) { throw "Expected two P3-A.1 comparison reports" }
          $base = $s.fixtures | Where-Object { $_.mode -eq 'p2b1' }
          $new = $s.fixtures | Where-Object { $_.mode -eq 'p3a1' }
          if ($base.strokes -ne $new.strokes) { throw "P3-A.1 changed total stroke count" }
          if ($new.strong_nonhorizontal_strokes -le $base.strong_nonhorizontal_strokes) { throw "P3-A.1 did not change drawing direction" }
          Write-Host ("P3-A.1 step smoke: same {0} strokes, strong nonhorizontal {1} -> {2}" -f $base.strokes, $base.strong_nonhorizontal_strokes, $new.strong_nonhorizontal_strokes)

      - name: Smoke-test P3-A.2 hybrid structural budget against frozen P2-B.1
        shell: pwsh
        run: |
          ./scripts/run-p3a2-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/p3a2-step -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P3-A.2 paired smoke failed" }
          $s = Get-Content experiments/local/ci/p3a2-step/summary.json -Raw | ConvertFrom-Json
          $base = $s.fixtures | Where-Object { $_.mode -eq 'p2b1' }
          $new = $s.fixtures | Where-Object { $_.mode -eq 'p3a2' }
          if ($base.strokes -ne $new.strokes) { throw "P3-A.2 changed total stroke count" }
          if ($s.tonal_prefix_identical_strokes -ne $s.hybrid_stats.tone_count) { throw "P3-A.2 tonal prefix mismatch" }
          if ($s.hybrid_stats.hybrid_selected + $s.hybrid_stats.contour_fallback -ne $s.hybrid_stats.structural_budget) { throw "P3-A.2 budget accounting mismatch" }
          if ($s.hybrid_stats.structural_budget -gt 0 -and $s.hybrid_stats.hybrid_selected -le 0) { throw "P3-A.2 did not exercise hybrid selection" }
          Write-Host ("P3-A.2 step smoke: total={0}; tone={1}; budget={2}; hybrid={3}; fallback={4}" -f $base.strokes,$s.hybrid_stats.tone_count,$s.hybrid_stats.structural_budget,$s.hybrid_stats.hybrid_selected,$s.hybrid_stats.contour_fallback)

      - name: Smoke-test P3-A.2.1 selective hybrid replacement
        shell: pwsh
        run: |
          ./scripts/run-p3a21-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/p3a21-step -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P3-A.2.1 paired smoke failed" }
          $s = Get-Content experiments/local/ci/p3a21-step/summary.json -Raw | ConvertFrom-Json
          $base = $s.fixtures | Where-Object { $_.mode -eq 'p2b1' }
          $new = $s.fixtures | Where-Object { $_.mode -eq 'p3a21' }
          if ($base.strokes -ne $new.strokes) { throw "P3-A.2.1 changed total stroke count" }
          if ($s.tonal_prefix_identical_strokes -ne $s.selective_stats.tone_count) { throw "P3-A.2.1 tonal prefix mismatch" }
          if ($s.selective_stats.replacements + $s.selective_stats.baseline_retained -ne $s.selective_stats.structural_budget) { throw "P3-A.2.1 budget accounting mismatch" }
          if ($s.selective_stats.replacements -gt $s.selective_stats.max_replacements) { throw "P3-A.2.1 exceeded replacement cap" }
          if ($s.changed_structural_slots -ne $s.selective_stats.replacements) { throw "P3-A.2.1 changed-slot accounting mismatch" }
          Write-Host ("P3-A.2.1 step smoke: total={0}; budget={1}; cap={2}; replacements={3}; retained={4}" -f $base.strokes,$s.selective_stats.structural_budget,$s.selective_stats.max_replacements,$s.selective_stats.replacements,$s.selective_stats.baseline_retained)

      - name: Smoke-test P3-A.2.2 missing-structure residual
        shell: pwsh
        run: |
          ./scripts/run-p3a22-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/p3a22-step -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P3-A.2.2 paired smoke failed" }
          $s = Get-Content experiments/local/ci/p3a22-step/summary.json -Raw | ConvertFrom-Json
          $base = $s.fixtures | Where-Object { $_.mode -eq 'p2b1' }
          $new = $s.fixtures | Where-Object { $_.mode -eq 'p3a22' }
          if ($base.strokes -ne $new.strokes) { throw "P3-A.2.2 changed total stroke count" }
          if ($s.tonal_prefix_identical_strokes -ne $s.missing_structure_stats.tone_count) { throw "P3-A.2.2 tonal prefix mismatch" }
          if ($s.missing_structure_stats.replacements + $s.missing_structure_stats.baseline_retained -ne $s.missing_structure_stats.structural_budget) { throw "P3-A.2.2 budget accounting mismatch" }
          if ($s.missing_structure_stats.replacements -gt $s.missing_structure_stats.max_replacements) { throw "P3-A.2.2 exceeded replacement cap" }
          if ($s.changed_structural_slots -ne $s.missing_structure_stats.replacements) { throw "P3-A.2.2 changed-slot accounting mismatch" }
          Write-Host ("P3-A.2.2 step smoke: total={0}; budget={1}; cap={2}; replacements={3}; retained={4}; mean-missing={5}" -f $base.strokes,$s.missing_structure_stats.structural_budget,$s.missing_structure_stats.max_replacements,$s.missing_structure_stats.replacements,$s.missing_structure_stats.baseline_retained,$s.missing_structure_stats.mean_missing)

      - name: Smoke-test P3-A.2.3 deficit-driven proposals
        shell: pwsh
        run: |
          ./scripts/run-p3a23-ab.ps1 -InputImage experiments/local/ci/step.png -OutputDir experiments/local/ci/p3a23-step -MaxSize 64 -Seed 42 -RightsConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P3-A.2.3 paired smoke failed" }
          $s = Get-Content experiments/local/ci/p3a23-step/summary.json -Raw | ConvertFrom-Json
          $base = $s.fixtures | Where-Object { $_.mode -eq 'p2b1' }
          $new = $s.fixtures | Where-Object { $_.mode -eq 'p3a23' }
          if ($base.strokes -ne $new.strokes) { throw "P3-A.2.3 changed total stroke count" }
          if ($s.tonal_prefix_identical_strokes -ne $s.deficit_proposal_stats.tone_count) { throw "P3-A.2.3 tonal prefix mismatch" }
          if ($s.deficit_proposal_stats.replacements + $s.deficit_proposal_stats.baseline_retained -ne $s.deficit_proposal_stats.structural_budget) { throw "P3-A.2.3 budget accounting mismatch" }
          if ($s.deficit_proposal_stats.replacements -gt $s.deficit_proposal_stats.max_replacements) { throw "P3-A.2.3 exceeded replacement cap" }
          if ($s.changed_structural_slots -ne $s.deficit_proposal_stats.replacements) { throw "P3-A.2.3 changed-slot accounting mismatch" }
          if ($s.deficit_proposal_stats.candidate_count -le 0) { throw "P3-A.2.3 generated no deficit-driven candidates" }
          Write-Host ("P3-A.2.3 step smoke: total={0}; budget={1}; cap={2}; replacements={3}; retained={4}; candidates={5}; mean-missing={6}" -f $base.strokes,$s.deficit_proposal_stats.structural_budget,$s.deficit_proposal_stats.max_replacements,$s.deficit_proposal_stats.replacements,$s.deficit_proposal_stats.baseline_retained,$s.deficit_proposal_stats.candidate_count,$s.deficit_proposal_stats.mean_missing)

      - name: Smoke-test P3-G1 batch harness on three rights-clear synthetic sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force experiments/local/ci/p3g1-sources | Out-Null
          Copy-Item experiments/local/ci/step.png experiments/local/ci/p3g1-sources/01-step.png
          Copy-Item experiments/local/ci/thin-lines.png experiments/local/ci/p3g1-sources/02-thin-lines.png
          Copy-Item experiments/local/ci/gradient.png experiments/local/ci/p3g1-sources/03-gradient.png
          ./scripts/run-p3g1-generalization.ps1 -InputDir experiments/local/ci/p3g1-sources -OutputDir experiments/local/ci/p3g1-run -MaxSize 64 -Seed 42 -RightsConfirmed -NonPortraitConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P3-G1 batch smoke failed" }
          $s = Get-Content experiments/local/ci/p3g1-run/summary.json -Raw | ConvertFrom-Json
          if ($s.source_count -ne 3) { throw "Expected exactly three P3-G1 smoke cases" }
          if ($s.cases.Count -ne 3) { throw "Missing P3-G1 case summaries" }
          if (-not (Test-Path experiments/local/ci/p3g1-run/summary.csv)) { throw "Missing P3-G1 CSV" }
          if (-not (Test-Path experiments/local/ci/p3g1-run/review.html)) { throw "Missing P3-G1 HTML review" }
          foreach ($case in $s.cases) {
            if ($case.strokes -le 0) { throw "Expected nonempty P3-G1 smoke stroke count" }
            if ($case.replacements -gt $case.max_replacements) { throw "P3-G1 case exceeded replacement cap" }
          }
          Write-Host ("P3-G1 smoke: {0} cases; edge wins {1}/{0}; white non-worse {2}/{0}" -f $s.source_count,$s.wins.edge_f1,$s.wins.white_nonworse)

      - name: Smoke-test P4-A.1 three-view pack harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force experiments/local/ci/p4a1-pack-sources | Out-Null
          Copy-Item experiments/local/ci/step.png experiments/local/ci/p4a1-pack-sources/01-step.png
          Copy-Item experiments/local/ci/thin-lines.png experiments/local/ci/p4a1-pack-sources/02-thin-lines.png
          Copy-Item experiments/local/ci/gradient.png experiments/local/ci/p4a1-pack-sources/03-gradient.png
          ./scripts/run-p4a1-pack.ps1 -InputDir experiments/local/ci/p4a1-pack-sources -OutputDir experiments/local/ci/p4a1-pack -MaxSize 64 -Seed 42 -RightsConfirmed -NonPortraitConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P4-A.1 pack smoke failed" }
          $s = Get-Content experiments/local/ci/p4a1-pack/summary.json -Raw | ConvertFrom-Json
          if ($s.source_count -ne 3) { throw "Expected three P4-A.1 pack cases" }
          if ($s.cases.Count -ne 3) { throw "Missing P4-A.1 pack case summaries" }
          if ($s.counts.sources_with_paths -lt 1) { throw "Expected at least one synthetic source with a long path" }
          if ($s.counts.sources_with_max_path_at_least_40px -lt 1) { throw "Expected at least one >=40px gesture path" }
          foreach ($case in $s.cases) {
            if ($case.paths_only_segment_count -ne 0) { throw "Paths-only pack case contains legacy segments" }
            if ($case.accepted_paths -ne $case.paths_only_logical_marks) { throw "Logical path accounting mismatch" }
          }
          if (-not (Test-Path experiments/local/ci/p4a1-pack/summary.csv)) { throw "Missing P4-A.1 pack CSV" }
          if (-not (Test-Path experiments/local/ci/p4a1-pack/review.html)) { throw "Missing P4-A.1 pack HTML" }
          Write-Host ("P4-A.1 pack smoke: paths={0}/{1}; >=40px={2}/{1}; edge wins={3}/{1}" -f $s.counts.sources_with_paths,$s.source_count,$s.counts.sources_with_max_path_at_least_40px,$s.counts.overlay_edge_f1_wins)

      - name: Smoke-test P4-A.2 hierarchy pack harness
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force experiments/local/ci/p4a2-pack-sources | Out-Null
          Copy-Item experiments/local/ci/form-detail.png experiments/local/ci/p4a2-pack-sources/01-form-detail.png
          Copy-Item experiments/local/ci/step.png experiments/local/ci/p4a2-pack-sources/02-step.png
          Copy-Item experiments/local/ci/gradient.png experiments/local/ci/p4a2-pack-sources/03-gradient.png
          ./scripts/run-p4a2-pack.ps1 -InputDir experiments/local/ci/p4a2-pack-sources -OutputDir experiments/local/ci/p4a2-pack -MaxSize 64 -Seed 42 -RightsConfirmed -NonPortraitConfirmed
          if ($LASTEXITCODE -ne 0) { throw "P4-A.2 pack smoke failed" }
          $s = Get-Content experiments/local/ci/p4a2-pack/summary.json -Raw | ConvertFrom-Json
          if ($s.source_count -ne 3) { throw "Expected three P4-A.2 pack cases" }
          if ($s.cases.Count -ne 3) { throw "Missing P4-A.2 pack case summaries" }
          if ($s.counts.sources_with_forms -lt 1) { throw "Expected at least one source with Form paths" }
          foreach ($case in $s.cases) {
            if ($case.form_count -gt 0) {
              if ($case.form_mean_px -lt 8 -or $case.form_mean_px -gt 32) { throw "Pack Form mean escaped target band" }
              if ($case.form_max_px -gt 32.01) { throw "Pack Form max escaped target band" }
            }
          }
          if (-not (Test-Path experiments/local/ci/p4a2-pack/summary.csv)) { throw "Missing P4-A.2 pack CSV" }
          if (-not (Test-Path experiments/local/ci/p4a2-pack/review.html)) { throw "Missing P4-A.2 pack HTML" }
          Write-Host ("P4-A.2 pack smoke: forms={0}/{1}; >=2 forms={2}/{1}; hierarchy edge wins={3}/{1}" -f $s.counts.sources_with_forms,$s.source_count,$s.counts.sources_with_at_least_two_forms,$s.counts.hierarchy_paths_edge_f1_wins_vs_p4a1)
